<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trader Acelerator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Light mode (default) ── */
    :root {
      --bg:         #f6f7fb;
      --bg2:        #ffffff;
      --text:       #13151f;
      --muted:      #6b7186;
      --accent:     #2563eb;
      --accent-h:   #1d4ed8;
      --shadow:     rgba(37, 99, 235, 0.26);
      --flash:      rgba(37, 99, 235, 0.14);
      --logo-mix:   multiply;
      --logo-filt:  none;
    }
    /* ── Dark mode (only when user previously chose it) ── */
    body.dark {
      --bg:         #0c0e14;
      --bg2:        #11141d;
      --text:       #d4d8ec;
      --muted:      #636882;
      --accent:     #5b8ef0;
      --accent-h:   #4a7de8;
      --shadow:     rgba(91, 142, 240, 0.26);
      --flash:      rgba(160, 200, 255, 0.18);
      --logo-mix:   lighten;
      --logo-filt:  invert(1);
    }

    html, body { height: 100%; }

    body {
      background: radial-gradient(1200px 700px at 50% -5%, var(--bg2), var(--bg) 60%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 40px 24px 90px;
      text-align: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Language selector ── */
    .lang-sel {
      position: fixed;
      top: 18px; right: 20px;
      display: flex;
      gap: 4px;
      z-index: 10;
      opacity: 0;
      animation: fadeDown 0.4s ease 0.3s forwards;
    }
    .lang-btn {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 5px 9px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.active {
      color: var(--accent);
      background: rgba(37,99,235,0.08);
      border-color: rgba(37,99,235,0.20);
    }
    body.dark .lang-btn.active {
      background: rgba(91,142,240,0.12);
      border-color: rgba(91,142,240,0.25);
    }

    /* ── Logo ── */
    .logo-wrap {
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeDown 0.45s ease 0.05s forwards;
    }
    .logo-img {
      height: 76px;
      width: auto;
      filter: var(--logo-filt);
      mix-blend-mode: var(--logo-mix);
    }

    /* ── Brand name block ── */
    #brand-block {
      position: relative;
      line-height: 1;
      margin-bottom: 46px;
    }

    .brand-line {
      display: block;
      font-weight: 900;
      letter-spacing: -0.035em;
      white-space: nowrap;
      font-size: clamp(46px, 9.5vw, 96px);
    }
    #brand-line1 { color: var(--text); }
    #brand-line2 { color: var(--text); }

    /* Individual letters — built bottom-to-top like a crane raising a building.
       The letter keeps its layout box (so the word width never shifts) and is
       revealed upward via clip-path, one after another, quickly. */
    .ltr {
      display: inline-block;
      clip-path: inset(100% 0 0 0);   /* fully hidden, revealed from the bottom up */
      opacity: 0;
      will-change: clip-path, opacity;
      animation: ltrBuild 0.16s ease-out forwards;
    }

    @keyframes ltrBuild {
      0%   { clip-path: inset(100% 0 0 0); opacity: 0; }
      12%  { opacity: 1; }
      100% { clip-path: inset(0 0 0 0);   opacity: 1; }
    }

    /* Post-assembly: whole block bounces in with elastic spring */
    #brand-block.assembled {
      animation: blockBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes blockBounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.075); }
      68%  { transform: scale(0.965); }
      100% { transform: scale(1); }
    }

    /* Flash burst radial glow */
    .brand-flash {
      position: absolute;
      inset: -28px -44px;
      border-radius: 28px;
      background: radial-gradient(ellipse at center, var(--flash) 0%, transparent 68%);
      opacity: 0;
      pointer-events: none;
    }
    .brand-flash.burst { animation: flashOut 0.7s ease-out forwards; }
    @keyframes flashOut {
      0%   { opacity: 0; transform: scale(0.7); }
      18%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    /* ── Cycling bullet line ── */
    .bullet-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 28px;
      margin-bottom: 46px;
      opacity: 0;
      animation: fadeUp 0.4s ease 1.75s forwards;
    }
    .bullet-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); opacity: 0.65; flex: none;
    }
    #bullet {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--muted);
      transition: opacity 0.28s ease, color 0.28s ease, font-weight 0.28s ease;
      white-space: nowrap;
      max-width: min(480px, 80vw);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #bullet.fading  { opacity: 0; }
    #bullet.hook    { color: var(--accent); font-weight: 700; }

    /* ── CTA button ── */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 54px;
      font-size: 15.5px;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 8px 30px var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      opacity: 0;
      animation: fadeUp 0.4s ease 1.95s forwards;
    }
    .cta:hover {
      background: var(--accent-h);
      transform: translateY(-2px);
      box-shadow: 0 14px 40px var(--shadow);
    }
    .cta svg { width: 16px; height: 16px; }

    /* ── Footer ── */
    .legal {
      position: fixed;
      bottom: 18px; left: 0; right: 0;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.45;
      pointer-events: none;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Respect reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      .ltr             { animation: none !important; opacity: 1 !important; clip-path: none !important; }
      #brand-block.assembled { animation: none !important; }
      .brand-flash     { display: none; }
      .logo-wrap, .bullet-row, .cta { animation: none !important; opacity: 1 !important; }
    }

    @media (max-width: 480px) {
      .brand-line { font-size: clamp(38px, 11vw, 54px); }
      #bullet     { font-size: 13px; max-width: 88vw; }
      .cta        { padding: 15px 38px; font-size: 14.5px; }
    }
  </style>
</head>
<body>

  <!-- Apply dark mode before paint — default is LIGHT -->
  <script>
    (function () {
      try { if (localStorage.getItem('scalpel_theme') === 'dark') document.body.classList.add('dark'); }
      catch (e) {}
    })();
  </script>

  <!-- Language selector -->
  <div class="lang-sel" id="lang-sel">
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="es">ES</button>
    <button class="lang-btn" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="pt">PT</button>
  </div>

  <!-- Logo -->
  <div class="logo-wrap">
    <img src="/static/logo.png" alt="Trader Acelerator" class="logo-img"
         onerror="this.style.display='none';" />
  </div>

  <!-- Animated brand name -->
  <div id="brand-block" aria-label="Trader Acelerator">
    <div class="brand-flash" id="brand-flash"></div>
    <span class="brand-line" id="brand-line1" aria-hidden="true"></span>
    <span class="brand-line" id="brand-line2" aria-hidden="true"></span>
  </div>

  <!-- Cycling feature tagline -->
  <div class="bullet-row">
    <div class="bullet-dot"></div>
    <span id="bullet"></span>
  </div>

  <!-- CTA -->
  <a href="/login" class="cta">
    <span id="cta-label">Enter</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
  </a>

  <p class="legal" id="legal-note">Trader Acelerator · For educational purposes only</p>

  <script>
    // ── Language: saved preference → browser locale → 'en' ──
    const SUPPORTED = ['en', 'es', 'fr', 'pt'];
    function detectLang() {
      try { const s = localStorage.getItem('scalpel_lang'); if (SUPPORTED.includes(s)) return s; } catch(e) {}
      const raw = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      if (raw.startsWith('es')) return 'es';
      if (raw.startsWith('fr')) return 'fr';
      if (raw.startsWith('pt')) return 'pt';
      return 'en';
    }
    let lang = detectLang();

    const I18N = {
      en: {
        bullets: [
          'Analyze your trades with structured feedback',
          'Develop your edge across any trading approach',
          'Belong to a community of serious traders',
          'Test your knowledge and earn your certificate',
          'Accelerate your growth — starting today',
        ],
        cta:   'Enter',
        legal: 'Trader Acelerator · For educational purposes only',
      },
      es: {
        bullets: [
          'Analiza tus operaciones con retroalimentación estructurada',
          'Desarrolla tu ventaja en cualquier estrategia',
          'Únete a una comunidad de traders serios',
          'Pon a prueba tu conocimiento y obtén tu certificado',
          'Acelera tu crecimiento — desde hoy',
        ],
        cta:   'Entrar',
        legal: 'Trader Acelerator · Solo con fines educativos',
      },
      fr: {
        bullets: [
          'Analysez vos trades avec un feedback structuré',
          "Développez votre edge quelle que soit votre approche",
          'Rejoignez une communauté de traders sérieux',
          'Testez vos connaissances et obtenez votre certificat',
          "Accélérez votre croissance — dès aujourd'hui",
        ],
        cta:   'Accéder',
        legal: 'Trader Acelerator · À des fins éducatives uniquement',
      },
      pt: {
        bullets: [
          'Analise suas operações com feedback estruturado',
          'Desenvolva sua vantagem em qualquer abordagem',
          'Faça parte de uma comunidade de traders sérios',
          'Teste seu conhecimento e conquiste seu certificado',
          'Acelere seu crescimento — a partir de hoje',
        ],
        cta:   'Entrar',
        legal: 'Trader Acelerator · Apenas para fins educativos',
      },
    };

    // Apply content for a given language code
    function applyLang(code) {
      const C = I18N[code] || I18N.en;
      document.documentElement.lang = code;
      document.getElementById('cta-label').textContent  = C.cta;
      document.getElementById('legal-note').textContent = C.legal;
      // Update active button
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === code);
      });
      return C;
    }

    let C = applyLang(lang);

    // ── Letter-by-letter "construction" animation ──
    // Each letter is raised bottom-to-top, one finishing before the next starts
    // (crane building an edifice), fast.
    const STEP_MS = 100;  // sequential stagger between letters
    const ANIM_MS = 160;  // matches CSS .ltr animation duration

    function buildLine(elId, word, startIdx) {
      const el = document.getElementById(elId);
      [...word].forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'ltr';
        span.textContent = ch;
        span.style.animationDelay = ((startIdx + i) * STEP_MS) + 'ms';
        el.appendChild(span);
      });
    }

    const W1 = 'TRADER', W2 = 'ACELERATOR';
    buildLine('brand-line1', W1, 0);
    buildLine('brand-line2', W2, W1.length);

    // When the last letter finishes landing → elastic bounce + glow burst
    const lastStart = (W1.length + W2.length - 1) * STEP_MS;
    const buildEnd  = lastStart + ANIM_MS + 35;

    setTimeout(() => {
      document.getElementById('brand-block').classList.add('assembled');
      document.getElementById('brand-flash').classList.add('burst');
    }, buildEnd);

    // ── Language selector handler ──
    document.getElementById('lang-sel').addEventListener('click', e => {
      const btn = e.target.closest('.lang-btn');
      if (!btn) return;
      lang = btn.dataset.lang;
      try { localStorage.setItem('scalpel_lang', lang); } catch(e) {}
      C = applyLang(lang);
      // Immediately show the current bullet in the new language
      bulletEl.classList.add('fading');
      setTimeout(() => { bi = bi % C.bullets.length; showBullet(bi); }, 280);
    });

    // ── Cycling bullet tagline ──
    const bulletEl = document.getElementById('bullet');
    const HOLD_MS  = 2300;
    const FADE_MS  = 300;
    let bi = 0;

    function showBullet(idx) {
      bulletEl.classList.remove('fading');
      bulletEl.textContent = C.bullets[idx];
      bulletEl.classList.toggle('hook', idx === C.bullets.length - 1);
    }

    function nextBullet() {
      bulletEl.classList.add('fading');
      setTimeout(() => {
        bi = (bi + 1) % C.bullets.length;
        showBullet(bi);
      }, FADE_MS);
    }

    // Start cycling shortly after the CTA fades in
    setTimeout(() => {
      showBullet(0);
      setInterval(nextBullet, HOLD_MS);
    }, 2100);
  </script>
</body>
</html>
