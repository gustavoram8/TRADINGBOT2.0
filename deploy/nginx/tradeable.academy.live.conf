# Tradeable Academy — nginx SIRVIENDO LA APLICACIÓN (fase abierta)
#
# Este archivo REEMPLAZA a `tradeable.academy.conf` (el de la página de "en
# construcción") el día del lanzamiento. Los dos se guardan porque volver
# atrás tiene que ser un solo comando, no reescribir a mano bajo presión.
#
# ── Instalación ───────────────────────────────────────────────────────────
#   sudo cp /var/www/TRADINGBOT2.0/deploy/nginx/tradeable.academy.live.conf \
#           /etc/nginx/sites-available/tradeable.academy
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── Volver atrás ──────────────────────────────────────────────────────────
#   sudo cp /var/www/TRADINGBOT2.0/deploy/nginx/tradeable.academy.conf \
#           /etc/nginx/sites-available/tradeable.academy
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ ANTES DE RECARGAR, en la config de supervisor:
#       SITE_URL=https://tradeable.academy
#       PUBLIC_HTTPS=1
#   y `supervisorctl reread && supervisorctl update`. Sin `SITE_URL`, los
#   enlaces de vuelta de PayPal se arman con el Host de la petición que los
#   disparó; sin `PUBLIC_HTTPS`, la cookie de sesión viaja sin marca Secure y
#   Flask cree que todo va en claro.
#
# ⚠️ Y `PUBLIC_HTTPS=1` APAGA el acceso por `http://62.171.180.22:5001`: la
#   cookie de sesión deja de enviarse por HTTP, así que ahí ya no se puede
#   iniciar sesión. No es una avería; es el precio de cerrar el sitio bien.
#   Si el dueño quiere conservar su vista previa, hay que montarle un
#   subdominio con HTTPS antes de encender esto.

# ── El bloque de certbot ──────────────────────────────────────────────────
# certbot ya escribió su propio `listen 443 ssl` con las rutas del certificado
# la primera vez. Al copiar este archivo encima se pierden esas líneas, así que
# hay DOS formas de hacerlo bien:
#   (a) copiar este archivo y volver a correr `sudo certbot --nginx -d
#       tradeable.academy -d www.tradeable.academy`, que las vuelve a escribir
#       solo; o
#   (b) pegar a mano el `location /` de abajo dentro del bloque 443 que ya
#       existe, sin tocar nada más.
# La (a) es la que menos se equivoca.

server {
    listen 80;
    listen [::]:80;
    server_name tradeable.academy www.tradeable.academy;

    # Let's Encrypt renueva cada tres meses y necesita esta ruta por HTTP
    # plano. Va ANTES de la redirección o la renovación automática se rompe
    # el día que nadie está mirando.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tradeable.academy www.tradeable.academy;

    # ssl_certificate / ssl_certificate_key — las escribe certbot.

    # Una captura de gráfico de 20 MB es lo que acepta la aplicación
    # (MAX_CONTENT_LENGTH). Si nginx se queda corto, el usuario recibe un 413
    # de nginx antes de que la aplicación pueda explicarle nada.
    client_max_body_size 24m;

    # ── Estáticos: servidos por nginx, sin gastar un worker ───────────────
    # Este es el multiplicador de capacidad real. Cada PNG, cada JS y cada
    # tipografía que sirve nginx es un worker de gunicorn que queda libre para
    # atender a alguien que sí necesita la aplicación.
    location /static/ {
        alias /var/www/TRADINGBOT2.0/scalpel/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /favicon.ico { alias /var/www/TRADINGBOT2.0/scalpel/static/favicon.ico; access_log off; }

    # ── El webhook de PayPal ──────────────────────────────────────────────
    # Se separa a propósito, con un tiempo de espera más generoso: la
    # verificación de la firma implica que NOSOTROS llamemos a PayPal desde
    # dentro del manejador, así que la petición tarda más que una página.
    # Y es el único camino por el que llega el cobro de una renovación: si
    # nginx lo corta por tiempo, PayPal lo da por fallido, reintenta unas
    # cuantas veces y luego se rinde — el cliente pagó y su plan no se
    # extendió, sin que nadie se entere.
    location ~ ^/webhook/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        access_log /var/log/nginx/tradeable.webhook.log;
    }

    # ── La aplicación ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ProxyFix(x_for=1) lee el ÚLTIMO valor de esta cadena, que es el que
        # añade nginx aquí — por eso la IP del visitante deja de ser
        # falsificable en cuanto se enciende PUBLIC_HTTPS.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Un análisis de IA tarda decenas de segundos. Con los 60s por defecto
        # el usuario recibe un 504 mientras la llamada sigue viva y el dinero
        # del análisis ya se gastó.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_buffering off;      # que el navegador reciba la página al vuelo
    }

    # Con el sitio abierto, los buscadores SÍ deben indexarlo. La regla de
    # `Disallow: /` de la fase de construcción tiene que morir aquí, o el sitio
    # queda invisible en Google sin que nadie sepa por qué.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://tradeable.academy/sitemap.xml\n";
    }

    access_log /var/log/nginx/tradeable.access.log;
    error_log  /var/log/nginx/tradeable.error.log;
}
