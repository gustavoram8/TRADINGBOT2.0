# Tradeable Academy — el sitio ABIERTO A TODO EL MUNDO (estado temporal)
#
# Sin pase y sin página de espera: cualquiera que entre al dominio ve la
# aplicación. Pedido por el dueño para un rato concreto; se vuelve atrás con
# un solo comando.
#
# Los CUATRO estados posibles del dominio viven en esta carpeta:
#   tradeable.academy.conf          → solo la página de "en construcción"
#   tradeable.academy.preview.conf  → la app para quien traiga el pase
#   tradeable.academy.abierto.conf  → la app para todos, SIN indexar (este)
#   tradeable.academy.live.conf     → el lanzamiento de verdad (indexable,
#                                     estáticos servidos por nginx)
#
# ── ABRIR ─────────────────────────────────────────────────────────────────
#   CERT=$(ls -d /etc/letsencrypt/live/*/ | head -1)
#   sed -e "s|# ssl_certificate.*|ssl_certificate ${CERT}fullchain.pem;\n    ssl_certificate_key ${CERT}privkey.pem;|" \
#       /var/www/TRADINGBOT2.0/deploy/nginx/tradeable.academy.abierto.conf \
#       > /etc/nginx/sites-available/tradeable.academy
#   nginx -t && systemctl reload nginx
#
# ── VOLVER A CERRAR (el pase de siempre) ──────────────────────────────────
#   Repetir el mismo bloque con `tradeable.academy.preview.conf` y añadiendo
#   al `sed` el reemplazo del pase:  -e "s/PASE-CAMBIAME/<tu-pase>/g"
#
# ⚠️ POR QUÉ ESTE ARCHIVO SIGUE SIN DEJAR QUE GOOGLE LO INDEXE.
# Es una apertura temporal, y la indexación no lo es: si Google entra ahora,
# se queda con una foto del sitio a medio terminar y puede tardar semanas en
# soltarla — incluso después de volver a cerrarlo. El `robots.txt` abierto
# vive en `…live.conf`, que es el del lanzamiento de verdad.
#
# ⚠️ Y lo que NO cambia por abrir la puerta: `PUBLIC_HTTPS` sigue apagada, así
# que la galleta de sesión viaja sin la marca `Secure`. Para un rato de
# pruebas es asumible; el día del lanzamiento hay que encenderla (y eso apaga
# el acceso por `http://IP:5001`).

server {
    listen 80;
    listen [::]:80;
    server_name tradeable.academy www.tradeable.academy;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tradeable.academy www.tradeable.academy;

    # ssl_certificate / ssl_certificate_key — las pone el sed de arriba.

    client_max_body_size 24m;

    # Se mantiene el no-cacheo: la aplicación es distinta para cada usuario, y
    # dejar que Cloudflare guarde una página ya autenticada y se la enseñe al
    # siguiente visitante es exactamente el fallo que costó una tarde entera.
    add_header Cache-Control "private, no-store, must-revalidate" always;
    add_header Vary "Cookie" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Los webhooks van por su propio sitio, con más tiempo de espera: la
    # verificación de firma implica que nosotros llamemos a PayPal desde
    # dentro del manejador, así que la petición tarda más que una página.
    location ~ ^/webhook/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        access_log /var/log/nginx/tradeable.webhook.log;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/tradeable.access.log;
    error_log  /var/log/nginx/tradeable.error.log;
}
