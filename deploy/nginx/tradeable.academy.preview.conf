# Tradeable Academy — el sitio REAL en el dominio, pero CON CONTRASEÑA
#
# Para qué es: poder probar en `https://tradeable.academy` (dominio de verdad,
# HTTPS de verdad, webhooks de PayPal de verdad) SIN abrir el sitio al público.
# Quien entre sin la contraseña ve una ventana del navegador pidiéndola, no la
# aplicación. Es el paso intermedio entre la página de "en construcción" y el
# lanzamiento.
#
# Los tres archivos de esta carpeta son los tres estados posibles del dominio:
#   tradeable.academy.conf          → la página de "en construcción" (hoy)
#   tradeable.academy.preview.conf  → la app, con contraseña (este)
#   tradeable.academy.live.conf     → la app, abierta al público
# Cambiar de estado = copiar el que toque encima y recargar nginx.
#
# ── Instalación ───────────────────────────────────────────────────────────
#   # 1. crear el usuario y la contraseña (una sola vez)
#   sudo apt-get install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd_tradeable mauro     # te la pide
#
#   # 2. poner en supervisor, en la línea environment= :
#   #      SITE_URL="https://tradeable.academy",PUBLIC_HTTPS="1"
#   sudo supervisorctl reread && sudo supervisorctl update
#
#   # 3. cambiar el sitio de nginx
#   sudo cp /var/www/TRADINGBOT2.0/deploy/nginx/tradeable.academy.preview.conf \
#           /etc/nginx/sites-available/tradeable.academy
#   sudo certbot --nginx -d tradeable.academy -d www.tradeable.academy
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ `PUBLIC_HTTPS=1` APAGA el acceso por `http://62.171.180.22:5001`: la cookie
#   de sesión deja de viajar sin cifrar, así que por ahí ya no se puede iniciar
#   sesión. A partir de aquí se previsualiza por el dominio, no por la IP.
#
# 🔑 EL WEBHOOK NO LLEVA CONTRASEÑA, y es a propósito: PayPal no sabe ninguna
#   contraseña. Si se le pidiera, recibiría un 401, daría el aviso por fallido y
#   el cobro de una renovación nunca llegaría a la aplicación. Está protegido de
#   otra forma, que es la buena: la firma del mensaje se verifica contra la API
#   de PayPal (`PAYPAL_WEBHOOK_ID`), así que un aviso inventado se rechaza igual.

server {
    listen 80;
    listen [::]:80;
    server_name tradeable.academy www.tradeable.academy;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tradeable.academy www.tradeable.academy;

    # ssl_certificate / ssl_certificate_key — las escribe certbot.

    client_max_body_size 24m;

    # Nada de esto debe aparecer en Google mientras sea una vista previa.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── Los webhooks: SIN contraseña ──────────────────────────────────────
    location ~ ^/webhook/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        access_log /var/log/nginx/tradeable.webhook.log;
    }

    location /static/ {
        auth_basic "Tradeable Academy";
        auth_basic_user_file /etc/nginx/.htpasswd_tradeable;
        alias /var/www/TRADINGBOT2.0/scalpel/static/;
        access_log off;
        expires 1h;
        try_files $uri =404;
    }

    location / {
        auth_basic "Tradeable Academy";
        auth_basic_user_file /etc/nginx/.htpasswd_tradeable;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/tradeable.access.log;
    error_log  /var/log/nginx/tradeable.error.log;
}
