# Tradeable Academy — el sitio REAL para ti, "en construcción" para los demás
#
# Es el estado intermedio del dominio, y el que hace falta para probar PayPal:
# `https://tradeable.academy` con HTTPS de verdad (que es lo que el webhook
# necesita) sin abrirle el sitio a nadie.
#
#   · Un visitante cualquiera  → la página de "en construcción", igual que hoy.
#   · Tú, con el pase puesto   → la aplicación entera.
#   · PayPal, en /webhook/…    → siempre la aplicación, sin pase.
#
# ── CÓMO FUNCIONA EL PASE ─────────────────────────────────────────────────
# Abres UNA vez una dirección secreta; el navegador se guarda una galleta y a
# partir de ahí ese navegador ve el sitio real. Nadie más lo ve, porque nadie
# más conoce la dirección. Se hace así y no con contraseña porque una ventana
# de contraseña le aparecería también al visitante, y entonces el dominio ya no
# diría "en construcción": diría "aquí hay algo y no te dejan pasar".
#
# ⚠️ La galleta la guarda EL NAVEGADOR: si quieres verlo también en el móvil,
#   abre la dirección secreta ahí también. Y si borras los datos del navegador,
#   vuelves a abrirla y ya está.
#
# ── INSTALACIÓN (todo esto se ejecuta EN EL VPS, no en tu Mac) ─────────────
#
#   # 1 · traer el código nuevo y reiniciar la app
#   cd /var/www/TRADINGBOT2.0
#   git pull origin claude/gallant-volta-i7cqmf
#   supervisorctl restart traderacelerator
#
#   # 2 · inventar el pase y escribirlo en la config (en los DOS sitios)
#   PASE=$(openssl rand -hex 16); echo "TU PASE ES: $PASE"
#   sed "s/PASE-CAMBIAME/$PASE/g" \
#       /var/www/TRADINGBOT2.0/deploy/nginx/tradeable.academy.preview.conf \
#       > /etc/nginx/sites-available/tradeable.academy
#
#   # 3 · decirle a la app que ya vive en el dominio, con HTTPS
#   #     (añadir a la línea environment= de /etc/supervisor/conf.d/*trader*.conf)
#   #       SITE_URL="https://tradeable.academy",PUBLIC_HTTPS="1"
#   supervisorctl reread && supervisorctl update
#
#   # 4 · recargar nginx y volver a pedirle el certificado
#   certbot --nginx -d tradeable.academy -d www.tradeable.academy
#   nginx -t && systemctl reload nginx
#
#   # 5 · VACIAR LA CACHÉ DE CLOUDFLARE
#   #     dash.cloudflare.com → tradeable.academy → Caching → Purge Everything
#   #
#   # 🔴 Este paso parece de relleno y NO lo es. El dominio pasa por Cloudflare
#   # (nube naranja), que lleva meses sirviendo la misma página de "en
#   # construcción" y la tiene guardada. Sin vaciarla puedes hacer TODO lo
#   # anterior perfecto y seguir viendo la página vieja — y no hay ningún error
#   # en ninguna parte que te diga que el problema es la caché. Se diagnostica
#   # así: `curl -sI https://tradeable.academy | grep -i cf-cache-status`; si
#   # dice HIT, lo estás viendo desde Cloudflare, no desde tu servidor.
#
#   # 6 · entrar UNA vez a:  https://tradeable.academy/pase/EL-PASE-DEL-PASO-2
#   #     (te devuelve a la portada, y a partir de ahí ves el sitio real)
#
# ⚠️ Guarda el pase donde guardes tus contraseñas. Si lo pierdes, repite el
#   paso 2 con uno nuevo — no pasa nada, solo invalida el anterior.
#
# ⚠️ `PUBLIC_HTTPS=1` APAGA el acceso por `http://62.171.180.22:5001`: la cookie
#   de sesión deja de viajar sin cifrar y por ahí ya no podrás iniciar sesión.
#   A partir de aquí previsualizas por el dominio. Es lo que queremos, pero que
#   no te pille de sorpresa.
#
# ── VOLVER ATRÁS ──────────────────────────────────────────────────────────
#   cp /var/www/TRADINGBOT2.0/deploy/nginx/tradeable.academy.conf \
#      /etc/nginx/sites-available/tradeable.academy
#   nginx -t && systemctl reload nginx

# `map` va FUERA del server (nginx lo exige: pertenece al bloque http, y los
# archivos de sites-enabled se incluyen justo ahí).
#
# El pase vale por DOS caminos, y hay una razón para cada uno:
#   · la galleta — el normal: se pone una vez y el navegador la lleva sola.
#   · `?pase=…`  — el de emergencia: funciona aunque la galleta falle o el
#     navegador la haya tirado, y sirve para comprobar de un vistazo si el
#     problema está en el pase o en otro sitio.
map $cookie_ta_pase $pase_galleta {
    default          0;
    "PASE-CAMBIAME"  1;
}
map $arg_pase $pase_url {
    default          0;
    "PASE-CAMBIAME"  1;
}
map "$pase_galleta$pase_url" $tiene_pase {
    default  1;      # cualquiera de los dos que valga, entra
    "00"     0;
}

server {
    listen 80;
    listen [::]:80;
    server_name tradeable.academy www.tradeable.academy;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tradeable.academy www.tradeable.academy;

    # ssl_certificate / ssl_certificate_key — las escribe certbot.

    client_max_body_size 24m;

    # 🔴 LO QUE HACÍA QUE ESTO NO FUNCIONARA — y por qué es obligatorio.
    #
    # El dominio pasa por Cloudflare, que guarda copias de las páginas para
    # servirlas él mismo sin molestar al servidor. Y su copia NO distingue
    # galletas: guarda "lo que hay en /" y se lo da a todo el mundo igual. Así
    # que la primera visita de un desconocido dejaba guardada la página de "en
    # construcción" y a partir de ahí el dueño, con su pase puesto, recibía esa
    # misma copia — su galleta nunca llegaba a preguntarle nada al servidor.
    # Vaciar la caché a mano no lo arregla: se vuelve a llenar con la siguiente
    # visita de cualquiera.
    #
    # Y el fallo va en las DOS direcciones, que es lo grave: si el dueño abría
    # una página estando dentro, Cloudflare podía guardar ESA y enseñársela al
    # siguiente visitante. Un sitio con puerta NUNCA debe poder guardarse en un
    # intermediario.
    #
    # `private` significa "esto es de un usuario concreto, no lo guardes para
    # otros" y `no-store` "no lo guardes en absoluto"; Cloudflare respeta las
    # dos, y el navegador también. `always` hace que se manden incluso en
    # respuestas de error y en las redirecciones.
    add_header Cache-Control "private, no-store, must-revalidate" always;
    add_header Vary "Cookie" always;

    # Mientras esto sea una vista previa, que Google no indexe nada.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── La puerta: se abre una vez y el navegador se guarda el pase ───────
    location = /pase/PASE-CAMBIAME {
        # ⚠️ Los `add_header` del servidor NO se heredan en un location que
        # tiene los suyos: nginx los sustituye, no los suma. Por eso el
        # Cache-Control se repite aquí — si no, esta redirección sería lo único
        # que Cloudflare sí podría guardar, y justo la que no debe.
        add_header Cache-Control "private, no-store, must-revalidate" always;
        add_header Set-Cookie "ta_pase=PASE-CAMBIAME; Path=/; Max-Age=31536000; HttpOnly; Secure; SameSite=Lax";
        return 302 https://$host/;
    }

    # ── Los webhooks: SIEMPRE a la aplicación, con pase o sin él ──────────
    # 🔑 PayPal no tiene navegador ni galletas. Si esto quedara detrás del
    # pase, recibiría la página de "en construcción" con un 200, daría el aviso
    # por entregado y el cobro de una renovación NUNCA llegaría a la app — y no
    # daría ningún error por ninguna parte. Está protegido de la forma correcta:
    # la firma del mensaje se verifica contra la propia API de PayPal.
    location ~ ^/webhook/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        access_log /var/log/nginx/tradeable.webhook.log;
    }

    # ── Todo lo demás: depende de si traes el pase ────────────────────────
    # El `if` solo hace `return`, que es uno de los dos usos seguros de `if`
    # en nginx; la bifurcación de verdad la hace `error_page` hacia la
    # location con nombre. Un `if` con `proxy_pass` dentro sí sería el patrón
    # roto del que todo el mundo advierte.
    location / {
        error_page 418 = @sitio;
        if ($tiene_pase) { return 418; }

        root /var/www/TRADINGBOT2.0/deploy/coming_soon;
        try_files $uri /index.html;
    }

    location @sitio {
        # En vista previa los estáticos también pasan por la aplicación. Es más
        # lento, pero son dos cosas menos que puedan salir mal; nginx los sirve
        # directo en `tradeable.academy.live.conf`, que es donde importa.
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/tradeable.access.log;
    error_log  /var/log/nginx/tradeable.error.log;
}
