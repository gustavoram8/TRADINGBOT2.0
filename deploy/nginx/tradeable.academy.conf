# Tradeable Academy — configuración de nginx (fase "en construcción")
#
# Estado actual: el dominio muestra SOLO la página de construcción. La
# aplicación real sigue corriendo en el puerto 5001 y no se expone aquí.
#
# Instalación en el VPS:
#   sudo cp /var/www/TRADINGBOT2.0/deploy/nginx/tradeable.academy.conf \
#           /etc/nginx/sites-available/tradeable.academy
#   sudo ln -sf /etc/nginx/sites-available/tradeable.academy \
#               /etc/nginx/sites-enabled/tradeable.academy
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificado SSL lo agrega certbot solo (crea el bloque 443 y la
# redirección desde el 80). NO hay que escribirlo a mano.

server {
    listen 80;
    listen [::]:80;
    server_name tradeable.academy www.tradeable.academy;

    root /var/www/TRADINGBOT2.0/deploy/coming_soon;
    index index.html;

    # Cualquier ruta que alguien invente cae en la misma página, no en un 404
    # feo. Mientras el sitio esté cerrado, todo el dominio es esta pantalla.
    location / {
        try_files $uri /index.html;
    }

    # Let's Encrypt escribe aquí su archivo de verificación. Tiene que quedar
    # accesible por HTTP plano incluso después de tener certificado, porque la
    # renovación automática lo vuelve a usar cada tres meses.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Mientras el sitio no esté abierto, que ningún buscador lo indexe: no
    # queremos que "Tradeable Academy" quede cacheado en Google como una
    # página de obras.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # El logo y los estáticos de la página de espera se cachean poco: durante
    # esta fase conviene poder cambiar el diseño y verlo al instante.
    location ~* \.(png|jpg|jpeg|svg|ico|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    access_log /var/log/nginx/tradeable.access.log;
    error_log  /var/log/nginx/tradeable.error.log;
}
