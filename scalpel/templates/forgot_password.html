<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trader Acelerator — Reset password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/auth.css" />
</head>
<body>
  <script>
    (function () {
      try { if (localStorage.getItem('scalpel_theme') === 'light') document.body.classList.add('light'); }
      catch (e) {}
    })();
  </script>

  <a href="/login" class="back-home" data-i18n="fp.back">← Back to sign in</a>

  <img src="/static/logo.png" alt="Trader Acelerator" class="auth-logo"
       onerror="this.style.display='none'; document.getElementById('lf').style.display='block';" />
  <div id="lf" class="auth-logo-fallback">TRADER ACELERATOR</div>

  <div class="auth-card">
    <div class="auth-title" data-i18n="fp.title">Reset your password</div>
    <div class="auth-sub" data-i18n="fp.sub">Enter your email and we'll send you a reset link</div>

    {% if sent %}
      <div class="alert alert-ok" data-i18n="fp.sent">If that email is registered, a reset link is on its way. Check your inbox (and spam).</div>
      <a href="/login" class="btn btn-ghost" data-i18n="fp.back">← Back to sign in</a>
    {% else %}
      <form method="POST" action="/forgot-password">
        <div class="field">
          <label for="email" data-i18n="fp.email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="fp.submit">Send reset link</button>
      </form>
    {% endif %}
  </div>

  <div class="legal" data-i18n="common.legal">For educational purposes only · Not financial advice</div>

  <script src="/static/auth.js"></script>
</body>
</html>
